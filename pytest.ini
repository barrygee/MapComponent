[pytest]
testpaths = tests
asyncio_mode = auto
; Fail fast when pytest runs outside the backend venv. Without this, a bare
; `python -m pytest` picking up a system/conda interpreter silently ignores
; `asyncio_mode` (warning only: "Unknown config option"), so every async test
; never runs its coroutine and ~98 tests fail with confusing 500s instead of
; the real cause. Run via `uv run --project backend pytest` (see CLAUDE.md).
required_plugins = pytest-asyncio
filterwarnings =
    ignore::DeprecationWarning:_pytest.assertion.rewrite
pythonpath = .
